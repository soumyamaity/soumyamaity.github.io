name: Deploy to Github Pages

on:
  push:
    branches:
    - PreProduction

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Regenerate the content manifests (blog / learning / projects) so
    # adding a markdown file is all that's ever needed to publish.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build content manifests
      run: python tools/build.py

    # Deploy everything except dev-only folders to the main branch.
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3.9.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: main
        publish_dir: ./
        exclude_assets: '.github,archive,tools,local-server,CLAUDE.md,SECURITY.md,.claude'
