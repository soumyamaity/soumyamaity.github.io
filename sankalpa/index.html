<style>
  :root { --bg:#F5EFE6; --paper:#FFFDF9; --dark:#1E1208; --brown:#5C3317; --mid:#8B5E3C; --gold:#D4A853; --muted:#C4B49A; --todo:#2C4A6E; --prog:#7A5C00; --block:#8B1A1A; --done:#1A5C3A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); font-family:'Lato',sans-serif; min-height:100vh; }
  h1,h2,h3 { font-family:'Playfair Display',serif; }

  #login-screen { position:fixed; inset:0; background:linear-gradient(135deg,#1E1208 0%,#5C3317 60%,#8B5E3C 100%); display:flex; align-items:center; justify-content:center; z-index:9999; }
  .login-box { background:#FFFDF9; border-radius:20px; padding:44px 38px; width:360px; box-shadow:0 32px 80px rgba(0,0,0,.5); text-align:center; }
  .login-box h2 { color:var(--brown); margin-bottom:6px; font-size:24px; }
  .login-box .sub { color:var(--muted); font-size:13px; margin-bottom:30px; letter-spacing:.04em; }
  .gsi-btn { display:inline-flex; align-items:center; gap:12px; background:#fff; color:#3c4043; border:1.5px solid #dadce0; border-radius:10px; padding:12px 22px; font-size:15px; font-family:'Lato',sans-serif; font-weight:700; cursor:pointer; transition:box-shadow .2s, background .2s; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .gsi-btn:hover { box-shadow:0 3px 10px rgba(0,0,0,.16); background:#f8f9fa; }
  .gsi-btn svg { width:20px; height:20px; }
  .login-err { color:#CC2222; font-size:13px; margin-top:18px; min-height:18px; line-height:1.4; }
  .db-note { font-size:11px; color:#BBB; margin-top:22px; line-height:1.5; }
  .login-spinner { display:none; margin-top:18px; color:var(--mid); font-size:13px; }

  #header { background:linear-gradient(135deg,#1E1208 0%,#5C3317 50%,#8B5E3C 100%); color:#FDF6EC; position:sticky; top:0; z-index:100; box-shadow:0 4px 24px rgba(30,18,8,.4); }
  .hdr-inner { max-width:1500px; margin:0 auto; padding:14px 20px; }
  .hdr-top { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .hdr-title h1 { font-size:20px; letter-spacing:.05em; }
  .hdr-title p { font-size:10px; opacity:.65; letter-spacing:.12em; margin-top:1px; font-family:'Lato',sans-serif; }
  .hdr-stats { display:flex; gap:18px; }
  .stat { text-align:center; }
  .stat-val { font-size:18px; font-weight:700; }
  .stat-lbl { font-size:9px; opacity:.6; letter-spacing:.1em; }
  .progress-ring { position:relative; width:50px; height:50px; }
  .progress-ring svg { transform:rotate(-90deg); }
  .progress-ring .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .user-chip { display:flex; align-items:center; gap:7px; }
  .user-chip img { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--gold); }
  .btn-add { background:var(--gold); color:var(--dark); border:none; border-radius:8px; padding:9px 18px; font-weight:700; font-size:14px; cursor:pointer; font-family:'Lato',sans-serif; letter-spacing:.02em; }
  .btn-add:hover { background:#C4953E; }
  .btn-logout { background:rgba(255,255,255,.12); color:#FDF6EC; border:1px solid rgba(255,255,255,.25); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:'Lato',sans-serif; }

  /* tabs */
  .tabs { display:flex; gap:4px; margin-top:14px; }
  .tab { padding:8px 18px; border-radius:8px 8px 0 0; background:rgba(255,255,255,.08); color:#FDF6EC; cursor:pointer; font-size:13px; font-weight:700; border:none; font-family:'Lato',sans-serif; opacity:.7; }
  .tab.active { background:var(--bg); color:var(--brown); opacity:1; }

  .filters { margin-top:12px; display:flex; flex-direction:column; gap:7px; }
  .filter-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .filter-row input[type=text] { padding:6px 12px; border-radius:8px; border:1.5px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:#FDF6EC; font-size:12px; font-family:'Lato',sans-serif; outline:none; min-width:160px; flex:1; }
  .filter-row input::placeholder { color:rgba(255,255,255,.5); }
  .flabel { font-size:10px; opacity:.6; letter-spacing:.08em; align-self:center; margin-right:2px; }
  .pill { padding:3px 10px; border-radius:20px; font-size:11px; cursor:pointer; font-family:'Lato',sans-serif; border:1.5px solid rgba(255,255,255,.2); background:transparent; color:#FDF6EC; transition:background .15s; }
  .pill.active { background:rgba(255,253,249,.25); border-color:#FDF6EC; font-weight:700; }

  #board { max-width:1500px; margin:0 auto; padding:20px 16px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media(max-width:900px){ #board { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:560px){ #board { grid-template-columns:1fr; } }
  .column { background:rgba(255,253,249,.65); border-radius:14px; border:2px solid rgba(196,180,154,.3); display:flex; flex-direction:column; min-height:400px; transition:border .15s, background .15s; }
  .column.drag-over { border-color:var(--col-accent); background:var(--col-light); }
  .col-header { padding:12px 14px 10px; border-bottom:2px solid rgba(196,180,154,.15); display:flex; align-items:center; justify-content:space-between; }
  .col-title { display:flex; align-items:center; gap:7px; font-family:'Playfair Display',serif; font-size:14px; font-weight:700; }
  .col-badge { font-size:11px; font-weight:700; color:#fff; padding:2px 8px; border-radius:10px; }
  .col-add { background:none; border:1.5px solid; border-radius:6px; width:23px; height:23px; cursor:pointer; font-size:15px; font-weight:700; line-height:21px; padding:0; }
  .cards-wrap { padding:8px; flex:1; display:flex; flex-direction:column; gap:7px; overflow-y:auto; }
  .empty-col { text-align:center; padding:28px 0; color:var(--muted); font-size:12px; user-select:none; }

  .card { background:var(--paper); border-radius:10px; padding:12px 12px 9px; border:1.5px solid #E8DFD2; box-shadow:0 2px 6px rgba(30,18,8,.06); cursor:grab; position:relative; transition:box-shadow .15s, opacity .15s; border-left:4px solid var(--col-accent); }
  .card:hover { box-shadow:0 6px 18px rgba(30,18,8,.13); }
  .card.dragging { opacity:.45; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:6px; margin-bottom:7px; }
  .card-title { font-family:'Playfair Display',serif; font-size:13.5px; color:var(--dark); line-height:1.35; flex:1; }
  .card-menu-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:17px; padding:0 2px; line-height:1; flex-shrink:0; }
  .card-badges { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .badge { font-size:10px; padding:2px 7px; border-radius:10px; }
  .badge-room { background:#F5EFE6; color:var(--brown); }
  .badge-cat { background:#EDE3F3; color:#5A2D82; }
  .badge-date { background:#E8F0F5; color:#2C4A6E; }
  .badge-date.overdue { background:#FBE3E3; color:#8B1A1A; }
  .badge-link { background:#FFF3D6; color:#7A5C00; }
  .card-note { font-size:11.5px; color:#777; line-height:1.55; margin-top:4px; }
  .card-note.clamped { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card-more { font-size:10px; background:none; border:none; cursor:pointer; padding:0; margin-top:2px; }
  .card-foot { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .card-date { font-size:10px; color:#C4B49A; }
  .card-attach { font-size:10px; color:var(--mid); }
  .card-thumbs { display:flex; gap:3px; margin-top:6px; flex-wrap:wrap; }
  .card-thumbs img { width:34px; height:34px; object-fit:cover; border-radius:5px; border:1px solid #E0D5C8; }

  .ctx-menu { position:absolute; right:0; top:22px; background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.15); z-index:99; min-width:150px; border:1px solid #E8DFD2; overflow:hidden; }
  .ctx-item { padding:9px 14px; font-size:13px; cursor:pointer; color:var(--dark); font-family:'Lato',sans-serif; }
  .ctx-item:hover { background:#F5EFE6; }
  .ctx-sep { font-size:10px; color:var(--muted); padding:4px 14px; font-weight:700; letter-spacing:.06em; background:#FAF7F3; }
  .ctx-del { color:#CC2222; }

  .modal-bg { position:fixed; inset:0; background:rgba(30,18,8,.65); z-index:200; display:flex; align-items:center; justify-content:center; padding:14px; }
  .modal-box { background:#FFFDF9; border-radius:16px; width:100%; max-width:600px; max-height:92vh; overflow-y:auto; box-shadow:0 24px 64px rgba(0,0,0,.35); }
  .modal-hdr { background:linear-gradient(135deg,#1E1208,#5C3317); padding:16px 20px; display:flex; justify-content:space-between; align-items:center; border-radius:16px 16px 0 0; position:sticky; top:0; z-index:2; }
  .modal-hdr span { color:#FDF6EC; font-weight:700; font-size:16px; font-family:'Playfair Display',serif; }
  .modal-hdr button { background:none; border:none; color:#FDF6EC; font-size:20px; cursor:pointer; }
  .modal-body { padding:20px; display:flex; flex-direction:column; gap:14px; }
  .form-row2 { display:flex; gap:14px; flex-wrap:wrap; }
  .form-row2 > div { flex:1; min-width:160px; }
  .form-label { display:block; font-size:11px; font-weight:700; color:var(--brown); margin-bottom:5px; letter-spacing:.06em; text-transform:uppercase; }
  .form-input { width:100%; padding:9px 12px; border:1.5px solid #D5C9B8; border-radius:8px; font-size:13.5px; font-family:'Lato',sans-serif; outline:none; background:#fff; color:var(--dark); }
  .form-input:focus { border-color:var(--brown); }
  .chip-row { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .chip { padding:4px 11px; border-radius:20px; font-size:11px; cursor:pointer; font-family:'Lato',sans-serif; border:1.5px solid #D5C9B8; background:#FAF7F3; color:var(--brown); transition:all .15s; }
  .chip.active { border-width:2px; font-weight:700; }
  .chip-add { padding:4px 10px; border-radius:20px; font-size:11px; cursor:pointer; border:1.5px dashed #C5B9A8; background:#fff; color:#999; font-family:'Lato',sans-serif; }
  .modal-foot { display:flex; gap:8px; justify-content:flex-end; border-top:1px solid #EDE5D8; padding-top:14px; }
  .btn-cancel { padding:8px 16px; border-radius:8px; border:1.5px solid #D5C9B8; background:#FAF7F3; cursor:pointer; font-family:'Lato',sans-serif; color:#666; }
  .btn-save { padding:8px 20px; border-radius:8px; border:none; background:var(--brown); color:#FDF6EC; cursor:pointer; font-family:'Lato',sans-serif; font-weight:700; }

  /* searchable dropdown for pre/post task linking */
  .ms-wrap { position:relative; }
  .ms-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:5px; }
  .ms-tag { display:inline-flex; align-items:center; gap:5px; background:#FFF3D6; color:#7A5C00; border:1px solid #E8CE8A; border-radius:14px; padding:3px 8px; font-size:11px; }
  .ms-tag button { background:none; border:none; color:#9A7A1A; cursor:pointer; font-size:12px; line-height:1; padding:0; }
  .ms-search { width:100%; padding:8px 12px; border:1.5px solid #D5C9B8; border-radius:8px; font-size:12.5px; font-family:'Lato',sans-serif; outline:none; background:#fff; color:var(--dark); }
  .ms-search:focus { border-color:var(--brown); }
  .ms-drop { position:absolute; left:0; right:0; top:100%; margin-top:3px; background:#fff; border:1.5px solid #D5C9B8; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.15); max-height:190px; overflow-y:auto; z-index:30; display:none; }
  .ms-drop.open { display:block; }
  .ms-opt { padding:8px 12px; font-size:12.5px; cursor:pointer; color:var(--dark); display:flex; align-items:center; gap:7px; }
  .ms-opt:hover, .ms-opt.hl { background:#F5EFE6; }
  .ms-opt .od { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .ms-empty { font-size:12px; color:#BBB; padding:8px 12px; }

  /* attachments */
  .attach-grid { display:flex; gap:8px; flex-wrap:wrap; }
  .attach-tile { position:relative; width:78px; }
  .attach-tile img { width:78px; height:78px; object-fit:cover; border-radius:8px; border:1.5px solid #E0D5C8; cursor:pointer; }
  .attach-file { width:78px; height:78px; border-radius:8px; border:1.5px solid #E0D5C8; background:#F5EFE6; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; color:var(--brown); text-align:center; padding:4px; cursor:pointer; }
  .attach-rm { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#E53935; color:#fff; border:none; cursor:pointer; font-size:11px; line-height:20px; padding:0; }
  .attach-add { width:78px; height:78px; border-radius:8px; border:2px dashed #C5B9A8; background:#FAF7F3; cursor:pointer; color:#999; font-size:24px; display:flex; align-items:center; justify-content:center; }
  .attach-name { font-size:9px; color:#BBB; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .upload-bar { font-size:11px; color:var(--mid); margin-top:4px; }

  #toast { position:fixed; bottom:24px; right:24px; background:#1A5C3A; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; font-family:'Lato',sans-serif; opacity:0; transition:opacity .3s; z-index:999; pointer-events:none; }
  #toast.show { opacity:1; }
  .sync-badge { font-size:10px; color:var(--gold); opacity:.8; }
  #offline-bar { display:none; background:#CC6633; color:#fff; text-align:center; font-size:12px; padding:5px; font-family:'Lato',sans-serif; }
  #offline-bar.show { display:block; }

  /* ── Gantt ── */
  #gantt-view { max-width:1500px; margin:0 auto; padding:20px 16px; }
  .gantt-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .gantt-toolbar select, .gantt-toolbar button { padding:6px 12px; border-radius:8px; border:1.5px solid #D5C9B8; background:#fff; font-family:'Lato',sans-serif; font-size:12px; cursor:pointer; color:var(--brown); }
  .gantt-wrap { background:var(--paper); border:1.5px solid #E8DFD2; border-radius:12px; overflow:auto; box-shadow:0 2px 10px rgba(30,18,8,.06); }
  .gantt-grid { position:relative; }
  .gantt-row { display:flex; align-items:stretch; border-bottom:1px solid #F0E8DE; height:37px; }
  .gantt-header { height:38px; }
  .gantt-row:hover { background:#FBF8F2; }
  .gantt-label { width:260px; min-width:260px; padding:8px 12px; font-size:12.5px; color:var(--dark); border-right:2px solid #EDE3D5; display:flex; align-items:center; gap:6px; position:sticky; left:0; background:inherit; z-index:3; }
  .gantt-label .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .gantt-track { position:relative; flex:1; }
  .gantt-header { display:flex; position:sticky; top:0; z-index:4; background:#F5EFE6; border-bottom:2px solid #EDE3D5; }
  .gantt-header .gantt-label { background:#F5EFE6; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--brown); }
  .gantt-daycell { border-right:1px solid #F0E8DE; font-size:9px; color:#A89A85; text-align:center; padding:4px 0; box-sizing:border-box; }
  .gantt-daycell.weekend { background:#F3ECE0; }
  .gantt-daycell.today { background:#FFF3D6; font-weight:700; color:var(--prog); }
  .gantt-bar { position:absolute; top:7px; height:22px; border-radius:6px; cursor:grab; display:flex; align-items:center; padding:0 6px; font-size:10px; color:#fff; white-space:nowrap; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.2); user-select:none; }
  .gantt-bar:active { cursor:grabbing; }
  .gantt-handle { position:absolute; top:0; width:8px; height:100%; cursor:ew-resize; }
  .gantt-handle.l { left:0; } .gantt-handle.r { right:0; }
  .gantt-dep { position:absolute; pointer-events:none; z-index:2; }
  .gantt-empty { padding:40px; text-align:center; color:var(--muted); }
  .gantt-legend { display:flex; gap:14px; margin-top:12px; flex-wrap:wrap; font-size:11px; color:#777; }
  .gantt-legend span { display:flex; align-items:center; gap:5px; }
  .gantt-legend .sw { width:14px; height:14px; border-radius:4px; }
  .gantt-nodate { padding:10px 12px; font-size:11px; color:#B08; background:#FDF0F0; border-top:1px solid #F0D8D8; }
</style>
</head>
<body>

<div id="offline-bar">⚠️ Offline — changes will sync when connection is restored</div>

<div id="login-screen">
  <div class="login-box">
    <h2>🏡 Sankalpa Interiors</h2>
    <div class="sub">FLAT 8A · TOWER 8 · NEW TOWN</div>
    <button class="gsi-btn" id="google-btn" onclick="signInGoogle()">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <div class="login-err" id="login-err"></div>
    <div class="login-spinner" id="login-spinner">Signing in…</div>
    <div class="db-note" id="db-note"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div id="header">
    <div class="hdr-inner">
      <div class="hdr-top">
        <div class="hdr-title">
          <h1>🏡 Sankalpa Interiors</h1>
          <p>FLAT 8A · TOWER 8 · NEW TOWN — RENOVATION TRACKER</p>
        </div>
        <div class="hdr-stats">
          <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-lbl">TASKS</div></div>
          <div class="stat"><div class="stat-val" id="s-done">0</div><div class="stat-lbl">DONE</div></div>
          <div class="stat"><div class="stat-val" id="s-pending">0</div><div class="stat-lbl">PENDING</div></div>
          <div class="progress-ring">
            <svg width="50" height="50"><circle cx="25" cy="25" r="20" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="4"/><circle id="prog-circle" cx="25" cy="25" r="20" fill="none" stroke="#D4A853" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 125.6"/></svg>
            <div class="pct" id="prog-pct">0%</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="sync-badge" id="sync-badge">●</span>
          <div class="user-chip" id="user-chip"></div>
          <button class="btn-add" onclick="openModal()">+ Add Task</button>
          <button class="btn-logout" onclick="signOutGoogle()">Sign out</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-board" onclick="switchTab('board')">📋 Board</button>
        <button class="tab" id="tab-gantt" onclick="switchTab('gantt')">📊 Gantt Chart</button>
      </div>

      <div class="filters" id="filters-block">
        <div class="filter-row">
          <input type="text" id="search" placeholder="🔍 Search tasks…" oninput="render()"/>

<script type="module">

const CAT_COLOR = {}; // assigned dynamically
const CAT_PALETTE = ["#5A2D82","#1A5C3A","#8B1A1A","#2C4A6E","#7A5C00","#964B00","#0B6E6E","#9B2D6E","#46603A","#6E4B1A","#3A3A6E","#7A3A3A","#2E6E4A"];
function catColor(cat){ if(!CAT_COLOR[cat]){ const idx=Object.keys(CAT_COLOR).length % CAT_PALETTE.length; CAT_COLOR[cat]=CAT_PALETTE[idx]; } return CAT_COLOR[cat]; }

const SEED = [
  { col:"todo",       title:"Bathroom & kitchen fittings — decide",        rooms:["Bathroom","Kitchen"], cats:["Plumbing","Sourcing"], prio:"Urgent", note:"Jaquar quote coming. Florentine Prime/Ornamix Prime shortlisted. ~Rs.25k per bathroom at 25% disc." },

  { col:"inprogress", title:"Wardrobe work — Mrinal Rana carpenter",      rooms:["Master Bedroom"], cats:["Carpentry"], prio:"High",   note:"Mrinal Rana: 9836905699. Drawing for attached bath bedroom wardrobe pending." },
  { col:"todo",       title:"Grill work — all windows & balcony",         rooms:["Balcony"], cats:["Civil"], prio:"High",   note:"Pintu Kundu: 9830729442. Measure after exhaust fan installed." },

  { col:"todo",       title:"Book packers & movers",                       rooms:["General"], cats:["Shifting"], prio:"Medium", note:"Book well in advance for July move." },
  { col:"todo",       title:"Deep cleaning before move-in",                rooms:["General"], cats:["Shifting","Miscellaneous"], prio:"Medium", note:"Full flat deep clean including commode & bathroom tiles." },
  { col:"todo",       title:"Install all electrical appliances",           rooms:["General"], cats:["Electrical"], prio:"Medium", note:"Fans, lights, exhaust fans, AC after painting done." },
  { col:"todo",       title:"Pooja / griha pravesh arrangements",          rooms:["Temple Room"], cats:["Pooja"], prio:"Medium", note:"Plan date, priest, samagri for house warming." },
  { col:"done",       title:"Society renovation intimation letter sent",   rooms:["General"], cats:["Sankalpa"], prio:"Low",    note:"Filed with committee for Flat 8A Tower 8 renovation." },
  { col:"done",       title:"Carpenter rate & plywood grade decided",      rooms:["General"], cats:["Carpentry"], prio:"Low",    note:"Sainik 710 (BWP) general; Club Prime for master wardrobe." },
  { col:"done",       title:"Atomberg exhaust fan model finalised",        rooms:["Bathroom"], cats:["Electrical","Sourcing"], prio:"Low",    note:"Atomberg Efficio 150mm 13W square cut — 2 needed." },
  { col:"done",       title:"Window sliding installed",                    rooms:["General"], cats:["Civil"], prio:"Low",    note:"Janla lagie dieche — dona confirmed 15 May." },
  { col:"done",       title:"Electrician contact saved (Debasish Babu)",  rooms:["General"], cats:["Electrical"], prio:"Low",    note:"VCF shared in group." },
];

/* ── state ── */
let app, db, auth, provider, storage;
let cards = {}, customCats = [], editId = null, dragId = null;
let fRoom = "All", fCat = "All", fPrio = "All";
let currentTab = "board", currentUser = null, seeded = false;
// form working state
let F = { col:"todo", prio:"Medium", rooms:[], cats:[], pre:[], post:[], attachments:[], start:"", deadline:"" };

const $ = id => document.getElementById(id);
function allCats(){ return [...DEFAULT_CATS, ...customCats.filter(c=>!DEFAULT_CATS.includes(c))]; }

/* ── init firebase ── */
try {
  app = initializeApp(window.FIREBASE_CONFIG);
  db = getFirestore(app); auth = getAuth(app); provider = new GoogleAuthProvider(); storage = getStorage(app);
} catch(e){ $("db-note").textContent = "⚠️ Firebase config missing — edit FIREBASE_CONFIG in the file."; }

window.signInGoogle = async () => {
  $("login-err").textContent=""; $("login-spinner").style.display="block";
  try { await signInWithPopup(auth, provider); }
  catch(e){ $("login-spinner").style.display="none"; $("login-err").textContent="Sign-in failed: "+(e.code||e.message); }
};
window.signOutGoogle = async () => { await signOut(auth); location.reload(); };

if (auth) onAuthStateChanged(auth, user => {
  if (user) {
    const email=(user.email||"").toLowerCase(); const allow=window.ALLOWED_EMAILS||[];
    if (allow.length>0 && !allow.map(e=>e.toLowerCase()).includes(email)) {
      $("login-spinner").style.display="none"; $("login-err").textContent=user.email+" is not authorised for this board."; signOut(auth); return;
    }
    currentUser=user; $("login-screen").style.display="none"; $("app").style.display="block"; showUser(user); startFirestore();
  } else { $("login-screen").style.display="flex"; $("app").style.display="none"; $("login-spinner").style.display="none"; }
});

function showUser(u){ const photo=u.photoURL?'<img src="'+u.photoURL+'" alt=""/>':''; const name=(u.displayName||u.email||"").split(" ")[0]; $("user-chip").innerHTML=photo+'<span style="font-size:12px">'+name+'</span>'; }

/* ── firestore ── */
function startFirestore(){
  $("sync-badge").style.color="#C4993A";
  window.addEventListener("online", ()=>$("offline-bar").classList.remove("show"));
  window.addEventListener("offline",()=>$("offline-bar").classList.add("show"));

  onSnapshot(collection(db,"kanban_cards"), snap=>{
    snap.docChanges().forEach(ch=>{ if(ch.type==="removed") delete cards[ch.doc.id]; else cards[ch.doc.id]={id:ch.doc.id,...ch.doc.data()}; });
    if(!seeded && Object.keys(cards).length===0){ seeded=true; seedData(); return; }
    seeded=true;
    // collect custom categories from existing cards
    Object.values(cards).forEach(c=> (c.cats||[]).forEach(cat=>{ if(!DEFAULT_CATS.includes(cat)&&!customCats.includes(cat)) customCats.push(cat); }));
    rerenderCurrent(); updateStats(); $("sync-badge").style.color="#1A5C3A";
  }, err=>{ console.error(err); $("sync-badge").style.color="#CC2222"; showToast("DB error: check Firestore rules", true); });

  window._dbSet = async (id,data)=>{ try{ await setDoc(doc(db,"kanban_cards",id),{...data,updatedAt:serverTimestamp()}); showToast("Saved ✓"); }catch(e){ console.error(e); showToast("Save failed ✗",true);} };
  window._dbDel = async (id)=>{ try{ await deleteDoc(doc(db,"kanban_cards",id)); }catch(e){ console.error(e);} };
}
async function seedData(){ const now=Date.now(); for(let i=0;i<SEED.length;i++){ const c={...SEED[i],id:"seed_"+i,ts:now-i*60000,rooms:SEED[i].rooms||[],cats:SEED[i].cats||[],pre:[],post:[],attachments:[],start:"",deadline:""}; await window._dbSet("seed_"+i,c);} }

/* ── migration helper: normalise old single room/cat to arrays ── */
function norm(c){
  return {
    id:c.id, title:c.title||"", note:c.note||"", col:c.col||"todo", prio:c.prio||"Medium",
    rooms: c.rooms || (c.room?[c.room]:[]),
    cats:  c.cats  || (c.category?[c.category]:[]),
    pre:   c.pre || [], post: c.post || [],
    attachments: c.attachments || [],
    start: c.start || "", deadline: c.deadline || "",
    ts: c.ts || Date.now()
  };
}

/* ── tab switch ── */
window.switchTab = (t)=>{
  currentTab=t;
  $("tab-board").classList.toggle("active",t==="board");
  $("tab-gantt").classList.toggle("active",t==="gantt");
  $("board").style.display = t==="board"?"grid":"none";
  $("gantt-view").style.display = t==="gantt"?"block":"none";
  $("filters-block").style.display = t==="board"?"flex":"none";
  rerenderCurrent();
};
function rerenderCurrent(){ if(currentTab==="board") render(); else renderGantt(); }

/* ── board render ── */
function getVisible(){
  const q=($("search")?.value||"").toLowerCase(); const s=$("sort")?.value||"newest";
  return Object.values(cards).map(norm)
    .filter(c=> (fRoom==="All"||(c.rooms||[]).includes(fRoom)) && (fCat==="All"||(c.cats||[]).includes(fCat)) && (fPrio==="All"||c.prio===fPrio) && (!q||c.title.toLowerCase().includes(q)||(c.note||"").toLowerCase().includes(q)))
    .sort((a,b)=> s==="newest"?b.ts-a.ts : s==="oldest"?a.ts-b.ts : s==="deadline"?((a.deadline||"9999")<(b.deadline||"9999")?-1:1) : s==="room"?((a.rooms[0]||"").localeCompare(b.rooms[0]||"")) : (PRIO_RANK[b.prio]||0)-(PRIO_RANK[a.prio]||0));
}
window.render = function render(){
  buildFilters();
  const vis=getVisible(), board=$("board"); board.innerHTML="";
  COLUMNS.forEach(col=> board.appendChild(buildColumn(col, vis.filter(c=>c.col===col.id), Object.values(cards).map(norm).filter(c=>c.col===col.id).length)));
};
function buildColumn(col,colCards,total){
  const div=document.createElement("div"); div.className="column"; div.style.setProperty("--col-accent",col.accent); div.style.setProperty("--col-light",col.light); div.dataset.col=col.id;
  div.innerHTML='<div class="col-header"><div class="col-title" style="color:'+col.accent+'">'+col.emoji+' '+col.label+'</div><div style="display:flex;gap:6px;align-items:center"><span class="col-badge" style="background:'+col.accent+'">'+total+'</span><button class="col-add" style="color:'+col.accent+';border-color:'+col.accent+'" onclick="openModal(\''+col.id+'\')">+</button></div></div><div class="cards-wrap">'+(colCards.length===0?'<div class="empty-col">Drop tasks here</div>':'')+'</div>';
  const wrap=div.querySelector(".cards-wrap");
  div.addEventListener("dragover",e=>{e.preventDefault();div.classList.add("drag-over");});
  div.addEventListener("dragleave",()=>div.classList.remove("drag-over"));
  div.addEventListener("drop",e=>{e.preventDefault();div.classList.remove("drag-over");if(dragId)moveCard(dragId,col.id);});
  colCards.forEach(c=>wrap.appendChild(buildCard(c,col.accent)));
  return div;
}
function dateBadge(c){
  if(!c.deadline) return "";
  const today=new Date().toISOString().slice(0,10);
  const overdue = c.col!=="done" && c.deadline < today;
  return '<span class="badge badge-date'+(overdue?' overdue':'')+'">⏰ '+fmtShort(c.deadline)+(overdue?' (late)':'')+'</span>';
}
function buildCard(card,accent){
  const div=document.createElement("div"); div.className="card"; div.style.setProperty("--col-accent",accent); div.draggable=true; div.dataset.id=card.id;
  const pc=PRIO_COLOR[card.prio]||"#999", date=new Date(card.ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"}), long=(card.note||"").length>80;
  const roomBadges=(card.rooms||[]).map(r=>'<span class="badge badge-room">'+(ROOM_ICON[r]||"📋")+' '+esc(r)+'</span>').join("");
  const catBadges=(card.cats||[]).map(c=>'<span class="badge badge-cat" style="background:'+catColor(c)+'22;color:'+catColor(c)+'">'+esc(c)+'</span>').join("");
  const depCount=(card.pre||[]).length+(card.post||[]).length;
  const depBadge=depCount?'<span class="badge badge-link">🔗 '+depCount+'</span>':'';
  const atts=(card.attachments||[]);
  const thumbs = atts.length? '<div class="card-thumbs">'+atts.slice(0,4).map(a=> a.type&&a.type.startsWith("image")?'<img src="'+a.url+'" alt=""/>':'<div class="attach-file" style="width:34px;height:34px;font-size:7px">📄</div>').join("")+(atts.length>4?'<span style="font-size:10px;color:#999;align-self:center">+'+(atts.length-4)+'</span>':'')+'</div>':'';
  div.innerHTML='<div class="card-top"><div class="card-title">'+esc(card.title)+'</div><button class="card-menu-btn" onclick="toggleMenu(event,\''+card.id+'\')">⋯</button></div>'+
    '<div class="card-badges">'+roomBadges+catBadges+'<span class="badge" style="background:'+pc+'22;color:'+pc+';border:1px solid '+pc+'55">'+card.prio+'</span>'+dateBadge(card)+depBadge+'</div>'+
    (card.note?'<div class="card-note clamped" id="note-'+card.id+'">'+esc(card.note)+'</div>'+(long?'<button class="card-more" style="color:'+accent+'" onclick="toggleNote(\''+card.id+'\',this)">show more ▼</button>':''):'')+
    thumbs+
    '<div class="card-foot"><span class="card-date">'+date+'</span>'+(atts.length?'<span class="card-attach">📎 '+atts.length+'</span>':'')+'</div>';
  div.addEventListener("dragstart",e=>{dragId=card.id;e.dataTransfer.effectAllowed="move";setTimeout(()=>div.classList.add("dragging"),0);});
  div.addEventListener("dragend",()=>{dragId=null;div.classList.remove("dragging");});
  div.addEventListener("dblclick",()=>openModal(card.col,card.id)); // double-click to edit
  return div;
}
window.toggleNote=(id,btn)=>{const el=$("note-"+id);if(el.classList.contains("clamped")){el.classList.remove("clamped");btn.textContent="show less ▲";}else{el.classList.add("clamped");btn.textContent="show more ▼";}};

window.toggleMenu=(e,id)=>{
  e.stopPropagation(); document.querySelectorAll(".ctx-menu").forEach(m=>m.remove());
  const card=cards[id]; if(!card)return;
  const menu=document.createElement("div"); menu.className="ctx-menu";
  const other=COLUMNS.filter(c=>c.id!==card.col);
  menu.innerHTML='<div class="ctx-item" onclick="openModal(\''+card.col+'\',\''+id+'\')">✎ Edit</div><div class="ctx-sep">MOVE TO</div>'+other.map(c=>'<div class="ctx-item" onclick="moveCard(\''+id+'\',\''+c.id+'\')">'+c.emoji+' '+c.label+'</div>').join("")+'<div style="border-top:1px solid #F0E8DE"></div><div class="ctx-item ctx-del" onclick="deleteCard(\''+id+'\')">✕ Delete</div>';
  e.currentTarget.parentElement.style.position="relative"; e.currentTarget.parentElement.appendChild(menu);
};
document.addEventListener("click",()=>document.querySelectorAll(".ctx-menu").forEach(m=>m.remove()));

window.moveCard=(id,toCol)=>{ const c=norm(cards[id]); if(!c)return; c.col=toCol; c.ts=Date.now(); cards[id]=c; window._dbSet(id,c); };
window.deleteCard=(id)=>{ if(!confirm("Delete this task?"))return; delete cards[id]; window._dbDel(id); rerenderCurrent(); updateStats(); };

/* ── modal ── */
window.openModal=(col,id)=>{
  editId=id||null; const card=id?norm(cards[id]):null;
  F = {
    col: card?.col||col||"todo", prio: card?.prio||"Medium",
    rooms:[...(card?.rooms||[])], cats:[...(card?.cats||[])],
    pre:[...(card?.pre||[])], post:[...(card?.post||[])],
    attachments:[...(card?.attachments||[])],
    start: card?.start||"", deadline: card?.deadline||""
  };
  $("f-title").value=card?.title||""; $("f-note").value=card?.note||"";
  $("f-start").value=F.start; $("f-deadline").value=F.deadline;
  $("modal-title").textContent=id?"Edit Task":"New Task";
  $("upload-bar").textContent="";
  renderModalChips();
  renderLinkPickers();
  renderAttach();
  $("modal").style.display="flex"; $("f-title").focus();
};
function renderModalChips(){
  // column
  buildChips("f-col", COLUMNS.map(c=>({id:c.id,label:c.emoji+" "+c.label,accent:c.accent})), [F.col], v=>{F.col=v;renderModalChips();}, false);
  // priority
  buildChips("f-prio", PRIO.map(p=>({id:p,label:p,accent:PRIO_COLOR[p]})), [F.prio], v=>{F.prio=v;renderModalChips();}, false);
  // rooms multi
  buildChips("f-room", ROOMS.map(r=>({id:r,label:ROOM_ICON[r]+" "+r})), F.rooms, v=>{ toggleArr(F.rooms,v); renderModalChips(); }, true);
  // categories multi + add new
  buildChips("f-cat", allCats().map(c=>({id:c,label:c,accent:catColor(c)})), F.cats, v=>{ toggleArr(F.cats,v); renderModalChips(); }, true, true);
}
function toggleArr(arr,v){ const i=arr.indexOf(v); if(i>=0)arr.splice(i,1); else arr.push(v); }
function buildChips(cid,items,activeArr,onChange,multi,withAdd){
  const el=$(cid); el.innerHTML="";
  items.forEach(it=>{ const b=document.createElement("button"); const on=activeArr.includes(it.id);
    b.className="chip"+(on?" active":""); b.textContent=it.label; b.type="button";
    if(on&&it.accent){b.style.borderColor=it.accent;b.style.background=it.accent+"22";b.style.color=it.accent;}
    b.onclick=()=>onChange(it.id); el.appendChild(b); });
  if(withAdd){ const a=document.createElement("button"); a.className="chip-add"; a.textContent="+ Add"; a.type="button";
    a.onclick=()=>{ const name=(prompt("New category name:")||"").trim(); if(name){ if(!allCats().includes(name)) customCats.push(name); if(!F.cats.includes(name)) F.cats.push(name); renderModalChips(); } };
    el.appendChild(a); }
}
function renderLinkPickers(){
  setupLinkPicker("pre", F.pre);
  setupLinkPicker("post", F.post);
}
function colDot(id){ const c=cards[id]?norm(cards[id]):null; const accent=COLUMNS.find(x=>x.id===(c?.col))?.accent||"#888"; return accent; }
function setupLinkPicker(which, arr){
  const search=$("f-"+which+"-search"), drop=$("f-"+which+"-drop"), tags=$("f-"+which+"-tags");
  let hl=-1;

  const others=()=>Object.values(cards).map(norm).filter(c=>c.id!==editId).sort((a,b)=>a.title.localeCompare(b.title));

  function paintTags(){
    tags.innerHTML="";
    arr.forEach(id=>{ const c=cards[id]?norm(cards[id]):null; const title=c?c.title:"(deleted task)";
      const t=document.createElement("span"); t.className="ms-tag";
      t.innerHTML='<span class="od" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+colDot(id)+'"></span>'+esc(title);
      const x=document.createElement("button"); x.type="button"; x.textContent="✕";
      x.onclick=()=>{ const i=arr.indexOf(id); if(i>=0)arr.splice(i,1); paintTags(); paintDrop(); };
      t.appendChild(x); tags.appendChild(t);
    });
  }
  function matches(){
    const q=search.value.trim().toLowerCase();
    return others().filter(o=>!arr.includes(o.id) && (!q || o.title.toLowerCase().includes(q)));
  }
  function paintDrop(){
    const list=matches(); drop.innerHTML=""; hl=-1;
    if(list.length===0){ drop.innerHTML='<div class="ms-empty">'+(others().length? "No matching tasks":"No other tasks yet")+'</div>'; return; }
    list.forEach((o,i)=>{ const opt=document.createElement("div"); opt.className="ms-opt"; opt.dataset.idx=i;
      opt.innerHTML='<span class="od" style="background:'+colDot(o.id)+'"></span>'+esc(o.title);
      opt.onmousedown=(e)=>{ e.preventDefault(); pick(o.id); };
      drop.appendChild(opt);
    });
  }
  function pick(id){ if(!arr.includes(id))arr.push(id); search.value=""; paintTags(); paintDrop(); drop.classList.add("open"); search.focus(); }
  function openDrop(){ paintDrop(); drop.classList.add("open"); }
  function closeDrop(){ drop.classList.remove("open"); }

  // wire fresh handlers (clear previous by cloning)
  search.oninput = openDrop;
  search.onfocus = openDrop;
  search.onblur  = ()=> setTimeout(closeDrop,150);
  search.onkeydown = (e)=>{
    const opts=[...drop.querySelectorAll(".ms-opt")];
    if(e.key==="ArrowDown"){ e.preventDefault(); hl=Math.min(hl+1,opts.length-1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); hl=Math.max(hl-1,0); }
    else if(e.key==="Enter"){ e.preventDefault(); const list=matches(); if(list[hl]) pick(list[hl].id); else if(list[0]) pick(list[0].id); return; }
    else if(e.key==="Backspace" && search.value==="" && arr.length){ arr.pop(); paintTags(); paintDrop(); return; }
    else if(e.key==="Escape"){ closeDrop(); return; }
    opts.forEach((o,i)=>o.classList.toggle("hl",i===hl));
    if(opts[hl]) opts[hl].scrollIntoView({block:"nearest"});
  };

  search.value="";
  paintTags(); paintDrop();
}

/* ── attachments ── */
function renderAttach(){
  const grid=$("f-attach"); grid.innerHTML="";
  F.attachments.forEach((a,i)=>{
    const tile=document.createElement("div"); tile.className="attach-tile";
    if(a.type&&a.type.startsWith("image")) tile.innerHTML='<img src="'+a.url+'" alt="" onclick="window.open(\''+a.url+'\',\'_blank\')"/>';
    else tile.innerHTML='<div class="attach-file" onclick="window.open(\''+a.url+'\',\'_blank\')">📄<div class="attach-name">'+esc((a.name||"file").slice(0,14))+'</div></div>';
    const rm=document.createElement("button"); rm.className="attach-rm"; rm.textContent="✕"; rm.type="button";
    rm.onclick=async()=>{ if(a.path && storage){ try{ await deleteObject(sRef(storage,a.path)); }catch(e){} } F.attachments.splice(i,1); renderAttach(); };
    tile.appendChild(rm); grid.appendChild(tile);
  });
  const add=document.createElement("div"); add.className="attach-add"; add.textContent="+"; add.onclick=()=>$("f-file-input").click();
  grid.appendChild(add);
}
$("f-file-input").addEventListener("change", async (e)=>{
  const files=[...e.target.files]; if(!files.length)return;
  if(!storage){ showToast("Storage not ready",true); return; }
  const taskId = editId || ("tmp_"+Date.now());
  for(const file of files){
    $("upload-bar").textContent="Uploading "+file.name+"…";
    try{
      const path="attachments/"+taskId+"/"+Date.now()+"_"+file.name.replace(/[^\w.\-]/g,"_");
      const r=sRef(storage,path); await uploadBytes(r,file); const url=await getDownloadURL(r);
      F.attachments.push({ name:file.name, url, path, type:file.type });
      renderAttach();
    }catch(err){ console.error(err); showToast("Upload failed: "+(err.code||""),true); }
  }
  $("upload-bar").textContent=""; e.target.value="";
});

window.closeModal=()=>{ $("modal").style.display="none"; editId=null; };
$("modal").addEventListener("click",e=>{ if(e.target===$("modal"))closeModal(); });

window.saveCard=()=>{
  const title=$("f-title").value.trim(); if(!title){alert("Title required");return;}
  const id=editId||(Date.now().toString(36)+Math.random().toString(36).slice(2));
  const existing = cards[id]?norm(cards[id]):null;
  const card={ id, title, note:$("f-note").value.trim(), col:F.col, prio:F.prio,
    rooms:F.rooms, cats:F.cats, pre:F.pre, post:F.post, attachments:F.attachments,
    start:$("f-start").value, deadline:$("f-deadline").value,
    ts: existing?.ts || Date.now() };
  cards[id]=card; window._dbSet(id,card);

  // keep reciprocal links in sync: my pre -> their post, my post -> their pre
  syncReciprocal(id, "pre", "post", F.pre, existing?.pre||[]);
  syncReciprocal(id, "post", "pre", F.post, existing?.post||[]);

  closeModal(); rerenderCurrent(); updateStats();
};
function syncReciprocal(myId, myField, theirField, newList, oldList){
  const added=newList.filter(x=>!oldList.includes(x));
  const removed=oldList.filter(x=>!newList.includes(x));
  added.forEach(tid=>{ const t=cards[tid]?norm(cards[tid]):null; if(t){ if(!t[theirField].includes(myId)){ t[theirField].push(myId); cards[tid]=t; window._dbSet(tid,t); } } });
  removed.forEach(tid=>{ const t=cards[tid]?norm(cards[tid]):null; if(t){ const i=t[theirField].indexOf(myId); if(i>=0){ t[theirField].splice(i,1); cards[tid]=t; window._dbSet(tid,t); } } });
}

/* ── stats & filters ── */
function updateStats(){
  const all=Object.values(cards).map(norm), done=all.filter(c=>c.col==="done").length, pct=all.length?Math.round(done/all.length*100):0;
  $("s-total").textContent=all.length; $("s-done").textContent=done; $("s-pending").textContent=all.length-done; $("prog-pct").textContent=pct+"%";
  const circ=2*Math.PI*20; $("prog-circle").setAttribute("stroke-dasharray",(circ*pct/100)+" "+circ);
}
function buildFilters(){
  const r=$("room-filters"),c=$("cat-filters"),p=$("prio-filters"); if(!r||!c||!p)return;
  r.innerHTML=["All",...ROOMS].map(x=>'<button class="pill'+(fRoom===x?" active":"")+'" onclick="setRoom(\''+x+'\')">'+(x==="All"?"🏠 All":ROOM_ICON[x]+" "+x)+'</button>').join("");
  c.innerHTML=["All",...allCats()].map(x=>'<button class="pill'+(fCat===x?" active":"")+'" onclick="setCat(\''+jsq(x)+'\')">'+esc(x)+'</button>').join("");
  p.innerHTML=["All",...PRIO].map(x=>'<button class="pill'+(fPrio===x?" active":"")+'" onclick="setPrio(\''+x+'\')" style="'+(fPrio===x&&PRIO_COLOR[x]?"border-color:"+PRIO_COLOR[x]+";color:"+PRIO_COLOR[x]:"")+'">'+x+'</button>').join("");
}
window.setRoom=x=>{fRoom=x;render();}; window.setCat=x=>{fCat=x;render();}; window.setPrio=x=>{fPrio=x;render();};

function showToast(msg,err=false){const t=$("toast");t.textContent=msg;t.style.background=err?"#CC2222":"#1A5C3A";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function jsq(s){return (s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function fmtShort(d){ if(!d)return""; const [y,m,day]=d.split("-"); const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return day+" "+mo[(+m)-1]; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });

/* ══════════════════════ GANTT CHART ══════════════════════ */
let ganttZoom = 26; // px per day
function dateToNum(d){ return d? Math.floor(new Date(d+"T00:00:00").getTime()/86400000) : null; }
function numToDate(n){ const dt=new Date(n*86400000); return dt.toISOString().slice(0,10); }

function ganttTasks(){
  // tasks with at least a deadline OR start; derive a 1-day bar if only deadline
  return Object.values(cards).map(norm).filter(c=> c.start || c.deadline ).map(c=>{
    let s = c.start? dateToNum(c.start): (c.deadline? dateToNum(c.deadline): null);
    let e = c.deadline? dateToNum(c.deadline): s;
    if(s===null && e!==null) s=e;
    if(e===null && s!==null) e=s;
    if(e<s) e=s;
    return { ...c, s, e };
  });
}

window.renderGantt = function renderGantt(){
  const view=$("gantt-view");
  const tasks=ganttTasks();
  const noDateTasks=Object.values(cards).map(norm).filter(c=>!c.start && !c.deadline);

  let toolbar='<div class="gantt-toolbar">'+
    '<strong style="font-family:Playfair Display,serif;color:var(--brown);font-size:16px">📊 Project Timeline</strong>'+
    '<span style="flex:1"></span>'+
    '<button onclick="ganttZoomFn(-4)">－ Zoom</button>'+
    '<button onclick="ganttZoomFn(4)">＋ Zoom</button>'+
    '<button onclick="window.openModal(\'todo\')">+ Add Task</button>'+
    '</div>';

  if(tasks.length===0){
    view.innerHTML=toolbar+'<div class="gantt-wrap"><div class="gantt-empty">No tasks have a Start or Deadline date yet.<br/>Open any task and set dates to see it on the timeline.</div></div>';
    return;
  }

  // timeline range
  let minD=Math.min(...tasks.map(t=>t.s)), maxD=Math.max(...tasks.map(t=>t.e));
  const today=dateToNum(new Date().toISOString().slice(0,10));
  minD=Math.min(minD,today)-2; maxD=Math.max(maxD,today)+3;
  const days=maxD-minD+1;
  const W=ganttZoom, labelW=260;

  // header
  let head='<div class="gantt-header"><div class="gantt-label">Task</div><div class="gantt-track" style="display:flex">';
  for(let i=0;i<days;i++){ const n=minD+i; const dt=new Date(n*86400000); const dow=dt.getDay(); const cls='gantt-daycell'+((dow===0||dow===6)?' weekend':'')+(n===today?' today':'');
    head+='<div class="'+cls+'" style="width:'+W+'px;min-width:'+W+'px">'+dt.getDate()+'<br/>'+["Su","Mo","Tu","We","Th","Fr","Sa"][dow]+'</div>'; }
  head+='</div></div>';

  // sort tasks: by start then deadline
  tasks.sort((a,b)=> a.s-b.s || a.e-b.e);
  const rowIndex={}; tasks.forEach((t,i)=>rowIndex[t.id]=i);

  let rows='';
  tasks.forEach((t,i)=>{
    const accent=COLUMNS.find(c=>c.id===t.col)?.accent||"#888";
    const left=(t.s-minD)*W, width=Math.max((t.e-t.s+1)*W,W);
    const cats=(t.cats||[]).slice(0,2).join(", ");
    rows+='<div class="gantt-row" data-id="'+t.id+'">'+
      '<div class="gantt-label"><span class="dot" style="background:'+accent+'"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(t.title)+'">'+esc(t.title)+'</span></div>'+
      '<div class="gantt-track" style="width:'+(days*W)+'px;position:relative;height:37px">'+
        '<div class="gantt-bar" data-id="'+t.id+'" style="left:'+left+'px;width:'+width+'px;background:'+accent+'" title="'+esc(t.title)+' ('+(t.start||"?")+' → '+(t.deadline||"?")+')">'+
          '<div class="gantt-handle l"></div>'+esc(t.title)+'<div class="gantt-handle r"></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  });

  // dependency arrows (pre -> this): drawn as SVG overlay
  let depSvg='';
  tasks.forEach(t=>{
    (t.pre||[]).forEach(pid=>{
      if(rowIndex[pid]===undefined) return;
      const from=tasks[rowIndex[pid]], to=t;
      const x1=labelW+(from.e-minD+1)*W, y1=38+rowIndex[pid]*37+18;
      const x2=labelW+(to.s-minD)*W,   y2=38+rowIndex[t.id]*37+18;
      depSvg+='<path d="M'+x1+','+y1+' C'+(x1+18)+','+y1+' '+(x2-18)+','+y2+' '+x2+','+y2+'" stroke="#B07A2A" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>';
    });
  });
  const totalH=tasks.length*37+38;
  const svgOverlay='<svg class="gantt-dep" width="'+(labelW+days*W)+'" height="'+totalH+'" style="position:absolute;top:0;left:0"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B07A2A"/></marker></defs>'+depSvg+'</svg>';

  let nodate = noDateTasks.length? '<div class="gantt-nodate">⚠️ '+noDateTasks.length+' task(s) hidden — no dates set: '+noDateTasks.slice(0,6).map(t=>esc(t.title)).join(", ")+(noDateTasks.length>6?"…":"")+'</div>' : '';

  view.innerHTML=toolbar+
    '<div class="gantt-wrap"><div class="gantt-grid" style="position:relative;min-width:'+(labelW+days*W)+'px">'+head+rows+svgOverlay+'</div></div>'+
    nodate+
    '<div class="gantt-legend">'+COLUMNS.map(c=>'<span><span class="sw" style="background:'+c.accent+'"></span>'+c.label+'</span>').join("")+
    '<span><span class="sw" style="background:#B07A2A"></span>dependency (pre→post)</span>'+
    '<span style="color:#A89A85">Drag a bar to move dates · drag edges to resize · double-click to edit</span></div>';

  attachGanttDrag(minD, W, labelW);
};

window.ganttZoomFn=(d)=>{ ganttZoom=Math.max(10,Math.min(60,ganttZoom+d)); renderGantt(); };

function attachGanttDrag(minD, W, labelW){
  document.querySelectorAll(".gantt-bar").forEach(bar=>{
    const id=bar.dataset.id;
    bar.addEventListener("dblclick",e=>{ e.stopPropagation(); const c=cards[id]; if(c)openModal(c.col,id); });
    let mode=null, startX=0, origLeft=0, origWidth=0;
    const onDown=(e,m)=>{ e.preventDefault(); e.stopPropagation(); mode=m; startX=e.clientX; origLeft=parseFloat(bar.style.left); origWidth=parseFloat(bar.style.width);
      document.addEventListener("mousemove",onMove); document.addEventListener("mouseup",onUp); };
    bar.addEventListener("mousedown",e=>{ if(e.target.classList.contains("gantt-handle"))return; onDown(e,"move"); });
    bar.querySelector(".gantt-handle.l").addEventListener("mousedown",e=>onDown(e,"l"));
    bar.querySelector(".gantt-handle.r").addEventListener("mousedown",e=>onDown(e,"r"));
    function onMove(e){
      const dx=e.clientX-startX; const dDays=Math.round(dx/W);
      if(mode==="move"){ bar.style.left=(origLeft+dDays*W)+"px"; }
      else if(mode==="l"){ const nl=origLeft+dDays*W, nw=origWidth-dDays*W; if(nw>=W){ bar.style.left=nl+"px"; bar.style.width=nw+"px"; } }
      else if(mode==="r"){ const nw=origWidth+dDays*W; if(nw>=W) bar.style.width=nw+"px"; }
    }
    function onUp(){
      document.removeEventListener("mousemove",onMove); document.removeEventListener("mouseup",onUp);
      const newLeft=parseFloat(bar.style.left), newWidth=parseFloat(bar.style.width);
      const newS=minD+Math.round(newLeft/W); const newE=newS+Math.round(newWidth/W)-1;
      const c=norm(cards[id]); c.start=numToDate(newS); c.deadline=numToDate(newE); cards[id]=c; window._dbSet(id,c);
      mode=null; renderGantt(); updateStats();
    }
  });
}
</script>
