  { col:"done",       title:"Carpenter rate & plywood grade decided",      room:"General",        prio:"Low",    note:"Sainik 710 (BWP) general; Club Prime for master wardrobe." },
  { col:"done",       title:"Atomberg exhaust fan model finalised",        room:"Bathroom",       prio:"Low",    note:"Atomberg Efficio 150mm 13W square cut — 2 needed." },
  { col:"done",       title:"Window sliding installed",                    room:"General",        prio:"Low",    note:"Janla lagie dieche — dona confirmed 15 May." },
  { col:"done",       title:"Electrician contact saved (Debasish Babu)",  room:"General",        prio:"Low",    note:"VCF shared in group." },
];

let app, db, auth, provider;
let cards = {}, editId = null, dragId = null;
let fRoom = "All", fPrio = "All";
let formCol = "todo", formRoom = "General", formPrio = "Medium";
let seeded = false, currentUser = null;

try {
  app = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(app);
  auth = getAuth(app);
  provider = new GoogleAuthProvider();
} catch(e) {
  document.getElementById("db-note").textContent = "⚠️ Firebase config missing — edit FIREBASE_CONFIG in the file.";
}

window.signInGoogle = async () => {
  document.getElementById("login-err").textContent = "";
  document.getElementById("login-spinner").style.display = "block";
  try { await signInWithPopup(auth, provider); }
  catch(e) {
    document.getElementById("login-spinner").style.display = "none";
    document.getElementById("login-err").textContent = "Sign-in failed: " + (e.code || e.message);
  }
};
window.signOutGoogle = async () => { await signOut(auth); location.reload(); };

if (auth) onAuthStateChanged(auth, user => {
  if (user) {
    const email = (user.email || "").toLowerCase();
    if (ALLOWED_EMAILS.length > 0 && !ALLOWED_EMAILS.map(e=>e.toLowerCase()).includes(email)) {
      document.getElementById("login-spinner").style.display = "none";
      document.getElementById("login-err").textContent = user.email + " is not authorised for this board.";
      signOut(auth); return;
    }
    currentUser = user;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    showUser(user); startFirestore();
  } else {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
    document.getElementById("login-spinner").style.display = "none";
  }
});

function showUser(user) {
  const chip = document.getElementById("user-chip");
  const photo = user.photoURL ? '<img src="'+user.photoURL+'" alt=""/>' : "";
  const name = (user.displayName || user.email || "").split(" ")[0];
  chip.innerHTML = photo + '<span style="font-size:12px">'+name+'</span>';
}

function startFirestore() {
  document.getElementById("sync-badge").style.color = "#C4993A";
  window.addEventListener("online",  () => document.getElementById("offline-bar").classList.remove("show"));
  window.addEventListener("offline", () => document.getElementById("offline-bar").classList.add("show"));

  const col = collection(db, "kanban_cards");
  onSnapshot(col, snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === "removed") delete cards[ch.doc.id];
      else cards[ch.doc.id] = { id: ch.doc.id, ...ch.doc.data() };
    });
    if (!seeded && Object.keys(cards).length === 0) { seeded = true; seedData(); return; }
    seeded = true; render(); updateStats();
    document.getElementById("sync-badge").style.color = "#1A5C3A";
  }, err => {
    console.error("Firestore error:", err);
    document.getElementById("sync-badge").style.color = "#CC2222";
    showToast("DB error: check Firestore rules", true);
  });

  window._dbSet = async (id, data) => {
    try { await setDoc(doc(db,"kanban_cards",id), { ...data, updatedAt: serverTimestamp() }); showToast("Saved ✓"); }
    catch(e){ console.error(e); showToast("Save failed ✗", true); }
  };
  window._dbDel = async (id) => { try { await deleteDoc(doc(db,"kanban_cards",id)); } catch(e){ console.error(e); } };
}

async function seedData() {
  const now = Date.now();
  for (let i=0;i<SEED.length;i++) await window._dbSet("seed_"+i, { ...SEED[i], id:"seed_"+i, ts: now-i*60000 });
}

function getVisible() {
  const q = document.getElementById("search")?.value?.toLowerCase() || "";
  const s = document.getElementById("sort")?.value || "newest";
  return Object.values(cards)
    .filter(c => (fRoom==="All"||c.room===fRoom) && (fPrio==="All"||c.prio===fPrio) && (!q||c.title.toLowerCase().includes(q)||(c.note||"").toLowerCase().includes(q)))
    .sort((a,b) => s==="newest"?b.ts-a.ts : s==="oldest"?a.ts-b.ts : s==="room"?(a.room||"").localeCompare(b.room||"") : (PRIO_RANK[b.prio]||0)-(PRIO_RANK[a.prio]||0));
}
window.render = function render() {
  buildFilters();
  const vis = getVisible(), board = document.getElementById("board"); board.innerHTML="";
  COLUMNS.forEach(col => board.appendChild(buildColumn(col, vis.filter(c=>c.col===col.id), Object.values(cards).filter(c=>c.col===col.id).length)));
};
function buildColumn(col, colCards, total) {
  const div = document.createElement("div"); div.className="column";
  div.style.setProperty("--col-accent",col.accent); div.style.setProperty("--col-light",col.light); div.dataset.col=col.id;
  div.innerHTML = '<div class="col-header"><div class="col-title" style="color:'+col.accent+'">'+col.emoji+' '+col.label+'</div><div style="display:flex;gap:6px;align-items:center"><span class="col-badge" style="background:'+col.accent+'">'+total+'</span><button class="col-add" style="color:'+col.accent+';border-color:'+col.accent+'" onclick="openModal(\''+col.id+'\')">+</button></div></div><div class="cards-wrap">'+(colCards.length===0?'<div class="empty-col">Drop tasks here</div>':'')+'</div>';
  const wrap = div.querySelector(".cards-wrap");
  div.addEventListener("dragover", e=>{ e.preventDefault(); div.classList.add("drag-over"); });
  div.addEventListener("dragleave", ()=> div.classList.remove("drag-over"));
  div.addEventListener("drop", e=>{ e.preventDefault(); div.classList.remove("drag-over"); if(dragId) moveCard(dragId,col.id); });
  colCards.forEach(c => wrap.appendChild(buildCard(c,col.accent)));
  return div;
}
function buildCard(card, accent) {
  const div = document.createElement("div"); div.className="card"; div.style.setProperty("--col-accent",accent); div.draggable=true; div.dataset.id=card.id;
  const pc = PRIO_COLOR[card.prio]||"#999", date = new Date(card.ts).toLocaleDateString("en-IN",{day:"numeric",month:"short"}), long=(card.note||"").length>80;
  div.innerHTML = '<div class="card-top"><div class="card-title">'+esc(card.title)+'</div><button class="card-menu-btn" onclick="toggleMenu(event,\''+card.id+'\')">⋯</button></div><div class="card-badges"><span class="badge badge-room">'+(ROOM_ICON[card.room]||"📋")+' '+esc(card.room)+'</span><span class="badge" style="background:'+pc+'22;color:'+pc+';border:1px solid '+pc+'55">'+card.prio+'</span></div>'+(card.note?'<div class="card-note clamped" id="note-'+card.id+'">'+esc(card.note)+'</div>'+(long?'<button class="card-more" style="color:'+accent+'" onclick="toggleNote(\''+card.id+'\',this)">show more ▼</button>':''):'')+'<div class="card-date">'+date+'</div>';
  div.addEventListener("dragstart", e=>{ dragId=card.id; e.dataTransfer.effectAllowed="move"; setTimeout(()=>div.classList.add("dragging"),0); });
  div.addEventListener("dragend", ()=>{ dragId=null; div.classList.remove("dragging"); });
  return div;
}
window.toggleNote = (id,btn)=>{ const el=document.getElementById("note-"+id); if(el.classList.contains("clamped")){el.classList.remove("clamped");btn.textContent="show less ▲";}else{el.classList.add("clamped");btn.textContent="show more ▼";} };

window.toggleMenu = (e,id)=>{
  e.stopPropagation(); document.querySelectorAll(".ctx-menu").forEach(m=>m.remove());
  const card=cards[id]; if(!card) return;
  const menu=document.createElement("div"); menu.className="ctx-menu";
  const other=COLUMNS.filter(c=>c.id!==card.col);
  menu.innerHTML='<div class="ctx-item" onclick="openModal(\''+card.col+'\',\''+id+'\')">✎ Edit</div><div class="ctx-sep">MOVE TO</div>'+other.map(c=>'<div class="ctx-item" onclick="moveCard(\''+id+'\',\''+c.id+'\')">'+c.emoji+' '+c.label+'</div>').join("")+'<div style="border-top:1px solid #F0E8DE"></div><div class="ctx-item ctx-del" onclick="deleteCard(\''+id+'\')">✕ Delete</div>';
  e.currentTarget.parentElement.style.position="relative"; e.currentTarget.parentElement.appendChild(menu);
};
document.addEventListener("click", ()=> document.querySelectorAll(".ctx-menu").forEach(m=>m.remove()));

window.moveCard = (id,toCol)=>{ const c=cards[id]; if(!c) return; c.col=toCol; c.ts=Date.now(); window._dbSet(id,c); };
window.deleteCard = (id)=>{ if(!confirm("Delete this task?")) return; delete cards[id]; window._dbDel(id); render(); updateStats(); };

window.openModal = (col,id)=>{
  editId=id||null; const card=id?cards[id]:null;
  formCol=card?.col||col||"todo"; formRoom=card?.room||"General"; formPrio=card?.prio||"Medium";
  document.getElementById("f-title").value=card?.title||""; document.getElementById("f-note").value=card?.note||"";
  document.getElementById("modal-title").textContent=id?"Edit Task":"New Task";
  const colItems=COLUMNS.map(c=>({id:c.id,label:c.emoji+" "+c.label,accent:c.accent}));
  const roomItems=ROOMS.map(r=>({id:r,label:ROOM_ICON[r]+" "+r}));
  const prioItems=PRIO.map(p=>({id:p,label:p,accent:PRIO_COLOR[p]}));
  const rc=()=>{ buildChips("f-col",colItems,formCol,v=>{formCol=v;rc();}); buildChips("f-room",roomItems,formRoom,v=>{formRoom=v;rc();}); buildChips("f-prio",prioItems,formPrio,v=>{formPrio=v;rc();}); };
  rc();
  document.getElementById("modal").style.display="flex"; document.getElementById("f-title").focus();
};
function buildChips(cid,items,active,onChange){
  const el=document.getElementById(cid); el.innerHTML="";
  items.forEach(it=>{ const b=document.createElement("button"); b.className="chip"+(it.id===active?" active":""); b.textContent=it.label;
    if(it.id===active&&it.accent){b.style.borderColor=it.accent;b.style.background=it.accent+"22";b.style.color=it.accent;}
    b.onclick=()=>onChange(it.id); el.appendChild(b); });
}
window.closeModal = ()=>{ document.getElementById("modal").style.display="none"; editId=null; };
document.getElementById("modal").addEventListener("click", e=>{ if(e.target===document.getElementById("modal")) closeModal(); });
window.saveCard = ()=>{
  const title=document.getElementById("f-title").value.trim(); if(!title){alert("Title required");return;}
  const id=editId||(Date.now().toString(36)+Math.random().toString(36).slice(2));
  const card={id,title,note:document.getElementById("f-note").value.trim(),col:formCol,room:formRoom,prio:formPrio,ts:cards[id]?.ts||Date.now()};
  cards[id]=card; window._dbSet(id,card); closeModal(); render(); updateStats();
};

function updateStats(){
  const all=Object.values(cards), done=all.filter(c=>c.col==="done").length, pct=all.length?Math.round(done/all.length*100):0;
  document.getElementById("s-total").textContent=all.length; document.getElementById("s-done").textContent=done;
  document.getElementById("s-pending").textContent=all.length-done; document.getElementById("prog-pct").textContent=pct+"%";
  const circ=2*Math.PI*20; document.getElementById("prog-circle").setAttribute("stroke-dasharray",(circ*pct/100)+" "+circ);
}
function buildFilters(){
  const rEl=document.getElementById("room-filters"), pEl=document.getElementById("prio-filters"); if(!rEl||!pEl) return;
  rEl.innerHTML=["All",...ROOMS].map(r=>'<button class="pill'+(fRoom===r?" active":"")+'" onclick="setRoom(\''+r+'\')">'+(r==="All"?"🏠 All":ROOM_ICON[r]+" "+r)+'</button>').join("");
  pEl.innerHTML=["All",...PRIO].map(p=>'<button class="pill'+(fPrio===p?" active":"")+'" onclick="setPrio(\''+p+'\')" style="'+(fPrio===p&&PRIO_COLOR[p]?"border-color:"+PRIO_COLOR[p]+";color:"+PRIO_COLOR[p]:"")+'">'+p+'</button>').join("");
}
window.setRoom = r=>{ fRoom=r; render(); };
window.setPrio = p=>{ fPrio=p; render(); };

function showToast(msg,err=false){ const t=document.getElementById("toast"); t.textContent=msg; t.style.background=err?"#CC2222":"#1A5C3A"; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
</script>
</body>
</html>
